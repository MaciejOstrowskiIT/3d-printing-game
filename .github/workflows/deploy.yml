name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Analytics for the GitHub Pages build only; empty variables keep it disabled. See infra/umami/README.md.
          VITE_UMAMI_HOST: ${{ vars.UMAMI_HOST }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.UMAMI_WEBSITE_ID }}
          VITE_UMAMI_ENDPOINT: ${{ vars.UMAMI_ENDPOINT }}
          # Bug report worker (infra/report-worker); empty falls back to an Umami event.
          VITE_REPORT_ENDPOINT: ${{ vars.REPORT_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    # Deploy only from main; pull requests just run tests and the build.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
