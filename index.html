<style>
/* Boot screen: plain HTML/CSS so it shows before any script runs, and while a portal SDK loads. */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#1e2128;z-index:100;transition:opacity .3s}
#boot.gone{opacity:0;pointer-events:none}
#boot .p{position:relative;width:96px;height:96px;border:8px solid #3a3c45;border-bottom-width:14px;border-radius:6px;background:#e9ebf0;box-sizing:border-box}
#boot .p i{position:absolute;left:50%;bottom:4px;width:34px;height:0;margin-left:-17px;background:repeating-linear-gradient(#e53935 0 6px,#cc2f2b 6px 12px);border-radius:3px;animation:boot 1.6s steps(8) infinite}
#boot .p b{position:absolute;left:20px;right:20px;top:14px;height:10px;border-radius:3px;background:#2f3039}
@keyframes boot{to{height:56px}}
@media (prefers-reduced-motion:reduce){#boot .p i{animation:none;height:36px}}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"><div class="p"><b></b><i></i></div></div>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
